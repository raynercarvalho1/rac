# Publicação da Edge Function "garmin" (manual, só main). Criado em 23/11/2026 a pedido do dono para não depender de colar os arquivos pelo chat.
# NÃO TESTADO em produção: a primeira execução é por conta do dono. Princípios (os mesmos dos outros workflows privilegiados do RAC):
#   - só roda a partir da main e só por clique (workflow_dispatch); nada publica sozinho a cada merge;
#   - o Environment "supabase-producao" guarda o segredo SUPABASE_ACCESS_TOKEN (token pessoal criado no Supabase pelo dono) e deve aceitar SÓ a main;
#   - o commit é o da main no momento do clique; os testes rodam ANTES, sem o segredo; só depois o job que tem o segredo publica;
#   - a CLI do Supabase vem por versão EXATA informada no clique (o dono escolhe uma versão estável; "latest" e intervalos são recusados);
#   - publica só supabase/functions/garmin, com o JWT desligado como já está em produção (a função autentica por conta própria); não mexe em secrets,
#     banco nem em outras funções; nenhum valor secreto vai a log.
name: Publicar a função garmin (manual, só main)

on:
  workflow_dispatch:
    inputs:
      versao_cli:
        description: "Versão EXATA da CLI do Supabase (por exemplo 2.40.7). Não aceita latest."
        required: true
        type: string

permissions: {}

concurrency:
  group: garmin-publicar
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Só a main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then echo "só roda a partir da main"; exit 1; fi
      - name: Versão da CLI precisa ser exata
        env:
          V: ${{ inputs.versao_cli }}
        run: |
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "informe uma versão exata, como 2.40.7"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Testes da função (sem segredo)
        run: node --test tests/garmin_extras.test.mjs tests/garmin_rotas.test.mjs tests/fit.test.mjs

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    environment: supabase-producao
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Publicar a função garmin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          V: ${{ inputs.versao_cli }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "falta o segredo SUPABASE_ACCESS_TOKEN no Environment supabase-producao"; exit 1; }
          npx --yes "supabase@${V}" functions deploy garmin --project-ref hofnhbxnfebfnncwxrds --no-verify-jwt
      - name: Resumo
        run: echo "função garmin publicada a partir do commit ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
