# RAC Inbox · POC autenticada iCloud — DESENHO B: workflow privilegiado que existe SÓ na main (reunião de segurança de 13/11/2026).
# Este arquivo só muda por merge na main (decisão do dono). Ele é disparado a partir da main com o commit da branch da POC como ENTRADA DE DADOS:
# os arquivos do Worker daquele commit são copiados por uma lista fixa, empacotados e inspecionados, mas NADA da branch é executado,
# nem com secrets, nem sem. Os Environments cloudflare-poc e icloud-auth-poc devem aceitar SÓ a main (configuração do dono no GitHub): assim,
# mesmo um workflow alterado numa branch, disparado de lá, não recebe nenhum secret nem o Environment.
# Operações (entrada "operacao"): validar_oidc (ensaio sem efeito e sem credencial), validar_uso_unico (prova SINTÉTICA do registro de uso único,
# sem credencial: concorrência e replay no runtime publicado) e p1_imap (autenticação IMAP somente leitura, com a credencial Apple vinda
# SÓ dos secrets do Environment icloud-auth-poc, cadastrados pelo dono direto no GitHub) e p2_imap (leitura controlada de UMA mensagem da pasta
# RAC-TESTE, somente leitura via EXAMINE, mesma credencial; a entrada opcional uid_mensagem escolhe o UID, sem ela lê a última). Todo token de
# operação protegida só vale UMA vez por execução (Durable Object com SQLite no Worker); por isso a chamada protegida da P1 e da P2 é única e
# SEM repetição automática.
# Três jobs, nenhum segredo passando de um para outro (por output, artefato ou log):
#   verificar (sem Environment e sem secrets) obtém o commit da POC como dado, CONFERE O CONTEÚDO DELE CONTRA OS PINS APROVADOS (arquivo
#     experimentos/icloud-auth-probe-ferramenta/aprovados.json, lido da main; cada operação só aceita o pin dela), monta o pacote a partir dos
#     objetos do Git, empacota sem publicar, inspeciona e calcula o sha256. Só entrega adiante o pacote (público) e o hash. O Wrangler vem do
#     lockfile da main, instalado sem scripts. A falha do pin acontece AQUI, antes de qualquer job com secrets ou Environment e antes de qualquer
#     pedido de aprovação: a aprovação humana do Environment não substitui esse controle;
#   provisionar (Environment cloudflare-poc, só secrets da Cloudflare) não baixa nem executa nada da branch: confere o hash do pacote
#     aprovado e o publica com uma configuração escrita neste arquivo;
#   executar (Environment icloud-auth-poc, sem nenhum secret) pede um token OIDC ao GitHub e o envia ao Worker por HTTPS. O Worker valida o
#     JWT (ref e workflow da main) antes de ler o corpo.
# Antes de aprovar o Environment, o aprovador confere no resumo do job verificar: o commit, o sha256 e os hashes dos arquivos, e confere que o
# CI do commit na PR da POC passou. Detalhes: docs/icloud-poc-deploy.md.
name: Prova autenticada iCloud (OIDC, manual, só main)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit da branch da POC a publicar, com 40 caracteres hexadecimais. É tratado só como dado."
        required: true
        type: string
      operacao:
        description: "validar_oidc (ensaio sem efeito), validar_uso_unico (prova sintética do uso único, sem credencial), p1_imap (IMAP somente leitura) ou p2_imap (leitura de uma mensagem da pasta RAC-TESTE, somente leitura); p1_imap e p2_imap exigem os secrets ICLOUD_USER e ICLOUD_APP_PASSWORD no Environment icloud-auth-poc."
        required: true
        default: validar_oidc
        type: choice
        options:
          - validar_oidc
          - validar_uso_unico
          - p1_imap
          - p2_imap
      uid_mensagem:
        description: "Só para p2_imap: UID da mensagem na pasta RAC-TESTE (número inteiro, até 10 dígitos). Vazio = a última mensagem da pasta."
        required: false
        default: ""
        type: string

# nenhuma permissão por padrão: cada job declara só o que precisa
permissions: {}

concurrency:
  group: icloud-auth-probe
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    # o pacote do Worker, o hash e o commit são públicos: não são segredo (nenhum secret existe neste job)
    outputs:
      commit: ${{ steps.empacotar.outputs.commit }}
      sha256: ${{ steps.empacotar.outputs.sha256 }}
      pacote: ${{ steps.empacotar.outputs.pacote }}
      pin: ${{ steps.pin.outputs.nome }}
      manifesto: ${{ steps.pin.outputs.manifesto }}
    defaults:
      run:
        shell: bash
    steps:
      # a entrada entra só por variável de ambiente (nunca colada no script)
      - name: Só na main e com um commit válido
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Este workflow só roda a partir da main (ref atual: $GITHUB_REF)."
            exit 1
          fi
          case "$COMMIT" in
            ""|*[!0-9a-f]*) echo "::error::O commit deve ter só caracteres hexadecimais minúsculos."; exit 1 ;;
          esac
          if [ "${#COMMIT}" != "40" ]; then
            echo "::error::O commit deve ter exatamente 40 caracteres."
            exit 1
          fi

      # actions fixadas por SHA de commit (a tag fica no comentário; SHAs conferidos direto nos repositórios oficiais)
      # 1) a parte CONFIÁVEL: só a ferramenta (package.json e lockfile do Wrangler) da main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /experimentos/icloud-auth-probe-ferramenta/
          sparse-checkout-cone-mode: false

      # 2) a parte NÃO CONFIÁVEL: os arquivos do Worker daquele commit, só como dados, numa pasta à parte
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          path: poc
          persist-credentials: false
          sparse-checkout: |
            /experimentos/icloud-auth-probe/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.3"

      # PORTÃO DO PIN (sem secrets, antes de empacotar e de qualquer job privilegiado). O conteúdo do commit da POC é lido dos OBJETOS do Git (não do
      # checkout) e comparado, por arquivo e por manifesto SHA-256, com o pin aprovado que a tabela "operacoes" associa a ESTA operação: p1_imap só
      # publica o conteúdo P1 e p2_imap só o P2. Manifesto = linha "rac-pin-v1" + uma linha "<sha256>␠␠<caminho>" por arquivo, em ordem bytewise.
      # Recusa: arquivo ausente, extra, renomeado ou alterado; entrada que não seja arquivo regular 100644 (link, submódulo, executável); nome fora
      # do padrão; pin ausente, inconsistente ou fora do formato; operação sem pin. O pin vem só do checkout da main (nenhuma entrada o substitui).
      - name: Conferir o pin aprovado da operação (portão antes de empacotar)
        id: pin
        env:
          COMMIT: ${{ inputs.commit }}
          OPERACAO: ${{ inputs.operacao }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          PIN=experimentos/icloud-auth-probe-ferramenta/aprovados.json
          RAIZ=experimentos/icloud-auth-probe
          [ -f "$PIN" ] || fail "O arquivo de pins aprovados não existe na main."
          jq -e '.formato == "rac-pin-v1" and (.operacoes | type == "object") and (.pins | type == "object")' "$PIN" > /dev/null || fail "O arquivo de pins aprovados está fora do formato esperado."
          jq -e --arg op "$OPERACAO" '.operacoes | has($op)' "$PIN" > /dev/null || fail "A operação não tem pin aprovado."
          [ "$(git -C poc rev-parse HEAD)" = "$COMMIT" ] || fail "O checkout da POC não está no commit pedido."
          # árvore do commit, lida dos objetos do Git: só arquivos regulares (100644) com nome simples
          ARV=$(git -C poc ls-tree -r -z --full-tree HEAD -- "$RAIZ/" | tr '\0' '\n')
          [ -n "$ARV" ] || fail "A pasta do Worker não existe neste commit."
          if printf '%s\n' "$ARV" | grep -qvE "^100644 blob [0-9a-f]{40}"$'\t'"$RAIZ/[A-Za-z0-9._/-]+$"; then
            fail "A pasta do Worker tem entrada que não é arquivo regular (link, submódulo, executável) ou nome fora do padrão."
          fi
          LISTA=$(printf '%s\n' "$ARV" | cut -f2- | sed "s#^$RAIZ/##" | LC_ALL=C sort)
          ACEITO=""
          MOTIVOS=""
          for NOME in $(jq -r --arg op "$OPERACAO" '.operacoes[$op][]' "$PIN"); do
            jq -e --arg n "$NOME" '.pins | has($n)' "$PIN" > /dev/null || fail "A operação aponta para um pin que não existe: $NOME."
            jq -e --arg n "$NOME" '.pins[$n] | (.manifesto_sha256 | test("^[0-9a-f]{64}$")) and (.commit_referencia | test("^[0-9a-f]{40}$")) and (.arquivos | type == "object" and has("wrangler.jsonc") and (to_entries | all((.key | test("^(src/[a-z]+\\.mjs|wrangler\\.jsonc)$")) and (.value | test("^[0-9a-f]{64}$")))))' "$PIN" > /dev/null || fail "O pin $NOME está fora do formato esperado."
            ESPERADA=$( { jq -r --arg n "$NOME" '.pins[$n].arquivos | keys[]' "$PIN"; echo README.md; } | LC_ALL=C sort)
            LISTAPIN=$(jq -r --arg n "$NOME" '.pins[$n].arquivos as $a | $a | keys[] | "\($a[.])  \(.)"' "$PIN")
            MANPIN=$( { echo rac-pin-v1; printf '%s\n' "$LISTAPIN"; } | sha256sum | cut -d' ' -f1)
            [ "$MANPIN" = "$(jq -r --arg n "$NOME" '.pins[$n].manifesto_sha256' "$PIN")" ] || fail "O pin $NOME é inconsistente: o manifesto não corresponde à lista de arquivos."
            if [ "$LISTA" != "$ESPERADA" ]; then
              MOTIVOS="$MOTIVOS $NOME:lista_de_arquivos"
              echo "Pin $NOME: a lista de arquivos do commit difere da aprovada (esperada < > encontrada):"
              diff <(printf '%s\n' "$ESPERADA") <(printf '%s\n' "$LISTA") || true
              continue
            fi
            HASHES="$RUNNER_TEMP/hashes-$NOME"
            : > "$HASHES"
            for ARQ in $(jq -r --arg n "$NOME" '.pins[$n].arquivos | keys[]' "$PIN"); do
              printf '%s  %s\n' "$(git -C poc cat-file blob "HEAD:$RAIZ/$ARQ" | sha256sum | cut -d' ' -f1)" "$ARQ" >> "$HASHES"
            done
            if [ "$(printf '%s\n' "$LISTAPIN")" != "$(cat "$HASHES")" ]; then
              MOTIVOS="$MOTIVOS $NOME:conteudo"
              echo "Pin $NOME: arquivos com conteúdo diferente do aprovado:"
              diff <(printf '%s\n' "$LISTAPIN") "$HASHES" | grep '^>' | sed 's/^> [0-9a-f]*  /  /' || true
              continue
            fi
            ACEITO="$NOME"
            break
          done
          [ -n "$ACEITO" ] || fail "O conteúdo do commit não corresponde a nenhum pin aprovado para a operação $OPERACAO (motivos:$MOTIVOS)."
          MANIFESTO=$( { echo rac-pin-v1; cat "$RUNNER_TEMP/hashes-$ACEITO"; } | sha256sum | cut -d' ' -f1)
          cp "$RUNNER_TEMP/hashes-$ACEITO" "$RUNNER_TEMP/pin-hashes.sha256"
          echo "$ACEITO" > "$RUNNER_TEMP/pin-nome"
          {
            echo "nome=$ACEITO"
            echo "manifesto=$MANIFESTO"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Pin aprovado conferido (antes de empacotar, sem secrets)"
            echo
            echo "- operação: \`$OPERACAO\`; pin: **$ACEITO**; manifesto sha256: \`$MANIFESTO\`"
            echo "- commit informado: \`$COMMIT\`; commit de referência do pin: \`$(jq -r --arg n "$ACEITO" '.pins[$n].commit_referencia' "$PIN")\` (informativo: o que vale é o conteúdo)"
            echo "- o pin vem do checkout da main; arquivos conferidos por conteúdo a partir dos objetos do Git (README fora do pin: não entra no pacote)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pin $ACEITO conferido para a operação $OPERACAO (manifesto $MANIFESTO)."

      # só os arquivos do pin entram no pacote, copiados dos OBJETOS do Git (o que foi conferido é exatamente o que é empacotado) e reconferidos
      # depois da cópia; qualquer outro arquivo, link simbólico ou configuração diferente derrubou o job no passo anterior. Nada da pasta poc é executado.
      - name: Montar o pacote a partir dos arquivos do pin (dados)
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -s "$RUNNER_TEMP/pin-hashes.sha256" ] || fail "O pin não foi conferido antes da montagem."
          [ "$(git -C poc rev-parse HEAD)" = "$COMMIT" ] || fail "O checkout da POC não está no commit pedido."
          RAIZ=experimentos/icloud-auth-probe
          PACOTE="$RUNNER_TEMP/pacote"
          mkdir -p "$PACOTE/src"
          while read -r H ARQ; do
            case "$ARQ" in
              src/*.mjs) git -C poc cat-file blob "HEAD:$RAIZ/$ARQ" > "$PACOTE/$ARQ" ;;
            esac
          done < "$RUNNER_TEMP/pin-hashes.sha256"
          cat > "$PACOTE/wrangler.jsonc" <<'JSON'
          {
            "name": "rac-icloud-auth-poc",
            "main": "src/index.mjs",
            "compatibility_date": "2026-11-13",
            "workers_dev": true,
            "observability": { "enabled": false },
            "durable_objects": { "bindings": [{ "name": "CONSUMO", "class_name": "ConsumoUnico" }] },
            "migrations": [{ "tag": "v1", "new_sqlite_classes": ["ConsumoUnico"] }]
          }
          JSON
          # a wrangler.jsonc do commit tem de ser equivalente à escrita aqui (que é a única usada)
          if [ "$(git -C poc cat-file blob "HEAD:$RAIZ/wrangler.jsonc" | jq -S 'del(."$schema")')" != "$(jq -S . "$PACOTE/wrangler.jsonc")" ]; then
            fail "A wrangler.jsonc do commit difere da configuração fixa do workflow."
          fi
          # reconferência dos arquivos copiados contra o pin
          (cd "$PACOTE" && grep -E '  src/' "$RUNNER_TEMP/pin-hashes.sha256" | sha256sum -c --quiet -) || fail "Um arquivo copiado difere do pin."
          cp "$RUNNER_TEMP/pin-hashes.sha256" "$RUNNER_TEMP/fontes.sha256"

      - name: Instalar o Wrangler pelo lockfile (sem scripts, integridade conferida)
        run: |
          FERR=experimentos/icloud-auth-probe-ferramenta
          npm ci --prefix "$FERR" --ignore-scripts --no-audit --no-fund
          INTEGRIDADE=$(jq -r '.packages["node_modules/wrangler"].integrity' "$FERR/package-lock.json")
          if [ "$INTEGRIDADE" != "sha512-yOHZUYEq9AP7vutWmkCADzCKAH9ynfvZdoKJRIGTzkiailf9/L+jhT7WRb+9p6jRDtuBXVFtCzLo7kGAcGw+pA==" ]; then
            echo "::error::A integridade do Wrangler no lockfile não é a esperada."
            exit 1
          fi
          VERSAO=$(node "$FERR/node_modules/wrangler/bin/wrangler.js" --version | tail -1)
          [ "$VERSAO" = "4.161.0" ] || { echo "::error::Versão do Wrangler inesperada: $VERSAO"; exit 1; }

      # empacota sem publicar (dry-run, sem credencial), inspeciona e calcula o hash do arquivo que será publicado
      - name: Empacotar sem publicar e inspecionar o resultado
        id: empacotar
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          PACOTE="$RUNNER_TEMP/pacote"
          DIST="$RUNNER_TEMP/dist"
          (cd "$PACOTE" && node "$GITHUB_WORKSPACE/experimentos/icloud-auth-probe-ferramenta/node_modules/wrangler/bin/wrangler.js" deploy --dry-run --outdir "$DIST")
          OUTROS=$(ls "$DIST" | grep -v -E '^(index\.js|index\.js\.map|README\.md)$' || true)
          if [ -n "$OUTROS" ]; then echo "::error::Arquivos inesperados no pacote gerado."; exit 1; fi
          BUNDLE="$DIST/index.js"
          for PADRAO in 'process\.env' 'eval\(' 'new Function' 'smtp\.mail\.me\.com' 'import\(' 'require\(' 'console\.'; do
            if grep -qE "$PADRAO" "$BUNDLE"; then echo "::error::O pacote contém uma construção proibida: $PADRAO"; exit 1; fi
          done
          # sockets: o único módulo "cloudflare:" permitido é cloudflare:sockets (IMAP da P1) e o único host da Apple é o IMAP
          MODULOS=$(grep -oE 'cloudflare:[a-z]+' "$BUNDLE" | sort -u)
          if [ "$MODULOS" != "cloudflare:sockets" ]; then echo "::error::O pacote importa módulos cloudflare: além de sockets."; exit 1; fi
          APPLE=$(grep -oE '[A-Za-z0-9.-]+\.mail\.me\.com' "$BUNDLE" | sort -u)
          if [ "$APPLE" != "imap.mail.me.com" ]; then echo "::error::O pacote cita endereço da Apple além do IMAP."; exit 1; fi
          # a P1 só usa CAPABILITY, LOGIN, LIST e LOGOUT; a P2 acrescenta EXAMINE, FETCH e UID (somente leitura, sempre com BODY.PEEK). Nenhum verbo de
          # alteração, de busca ou de outra pasta pode estar no pacote, e as duas listas de verbos têm de ser exatamente estas (DELETE e CREATE existem só como
          # SQL do registro de uso único do Durable Object, por isso a garantia deles é a lista exata de verbos e o teste do código, não esta busca)
          if grep -qwE 'EXPUNGE|APPEND|STORE|SEARCH|RENAME|SUBSCRIBE|UNSUBSCRIBE|AUTHENTICATE|STARTTLS|SELECT|UNSELECT|COPY|MOVE|IDLE|NOOP|CLOSE|STATUS|ENABLE|NAMESPACE|FLAGS' "$BUNDLE"; then echo "::error::O pacote contém verbo IMAP não permitido."; exit 1; fi
          # as listas de verbos dependem do pin conferido (o pacote P1 não pode ter nada da P2; o P2 tem as duas listas)
          PIN_NOME=$(cat "$RUNNER_TEMP/pin-nome" 2>/dev/null || true)
          case "$PIN_NOME" in p1|p2) ;; *) echo "::error::O pin da operação não foi conferido antes do empacotamento."; exit 1 ;; esac
          if ! grep -qF 'Object.freeze(["CAPABILITY", "LOGIN", "LIST", "LOGOUT"])' "$BUNDLE"; then echo "::error::A lista de verbos da P1 não é a esperada."; exit 1; fi
          if [ "$PIN_NOME" = "p2" ]; then
            if ! grep -qF 'Object.freeze(["CAPABILITY", "LOGIN", "LIST", "EXAMINE", "FETCH", "UID", "LOGOUT"])' "$BUNDLE"; then echo "::error::A lista de verbos da P2 não é a esperada."; exit 1; fi
            # leitura sempre com PEEK (não mexe em flags): nenhum RFC822 além do tamanho
            if [ "$(grep -oE 'RFC822[A-Za-z.]*' "$BUNDLE" | sort -u)" != "RFC822.SIZE" ]; then echo "::error::O pacote cita RFC822 além do tamanho."; exit 1; fi
          else
            if grep -qwE 'EXAMINE|FETCH|UID|RFC822' "$BUNDLE" || grep -qF 'VERBOS_P2' "$BUNDLE"; then echo "::error::O pacote do pin P1 contém verbo ou lista da P2."; exit 1; fi
          fi
          # nenhuma leitura de corpo sem PEEK em nenhum dos dois
          if grep -qF 'BODY[' "$BUNDLE"; then echo "::error::O pacote contém leitura sem PEEK."; exit 1; fi
          # o Durable Object do registro de uso único precisa estar no pacote E exportado (a migração e o binding o referenciam)
          if ! grep -qE '^var ConsumoUnico = class' "$BUNDLE" || ! grep -qE '^  ConsumoUnico,?$' "$BUNDLE"; then echo "::error::A classe do Durable Object não está no pacote ou não é exportada."; exit 1; fi
          # endereços http(s): o emissor do GitHub e o nome interno e fixo do Durable Object (não resolve na rede)
          HOSTS=$(grep -oE 'https?://[A-Za-z0-9.-]+' "$BUNDLE" | sort -u)
          if [ "$HOSTS" != $'https://consumo.interno\nhttps://token.actions.githubusercontent.com' ]; then echo "::error::O pacote cita endereços fora do emissor do GitHub e do objeto interno."; exit 1; fi
          SHA=$(sha256sum "$BUNDLE" | cut -d' ' -f1)
          {
            echo "commit=$COMMIT"
            echo "sha256=$SHA"
            echo "pacote=$(base64 -w0 "$BUNDLE")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Pacote do Worker rac-icloud-auth-poc (antes da aprovação do ambiente)"
            echo
            echo "- commit da POC (dado de entrada): \`$COMMIT\`"
            echo "- sha256 do arquivo que será publicado: \`$SHA\`"
            echo "- tamanho: $(wc -c < "$BUNDLE") bytes; endereços no pacote: token.actions.githubusercontent.com e o nome interno consumo.interno (Durable Object)"
            echo "- sem process.env, eval, console, SMTP, import dinâmico ou require; único módulo cloudflare: sockets; único host da Apple: imap.mail.me.com; verbos IMAP: pin P1 = CAPABILITY, LOGIN, LIST, LOGOUT; pin P2 acrescenta EXAMINE, FETCH e UID (somente leitura, BODY.PEEK); sem STORE, COPY, MOVE, EXPUNGE, DELETE, APPEND, SELECT, busca ou SMTP"
            echo "- configuração fixa: Durable Object CONSUMO (classe ConsumoUnico, SQLite) e migração v1 (nova classe)"
            echo "- pin aprovado conferido no passo anterior (o conteúdo bate com o pin da operação; sem isso este job já teria falhado)"
            echo "- **Antes de aprovar:** conferir o diff dos arquivos abaixo no commit e se o CI desse commit passou na PR da POC."
            echo
            echo '```'
            cat "$RUNNER_TEMP/fontes.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  provisionar:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-poc
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Só na main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Este workflow só roda a partir da main (ref atual: $GITHUB_REF)."
            exit 1
          fi

      # só os dados da ferramenta (package.json e lockfile) vêm do repositório, da main; a branch da POC não é baixada aqui
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /experimentos/icloud-auth-probe-ferramenta/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.3"

      - name: Instalar o Wrangler pelo lockfile (sem scripts, integridade conferida)
        run: |
          FERR=experimentos/icloud-auth-probe-ferramenta
          npm ci --prefix "$FERR" --ignore-scripts --no-audit --no-fund
          INTEGRIDADE=$(jq -r '.packages["node_modules/wrangler"].integrity' "$FERR/package-lock.json")
          if [ "$INTEGRIDADE" != "sha512-yOHZUYEq9AP7vutWmkCADzCKAH9ynfvZdoKJRIGTzkiailf9/L+jhT7WRb+9p6jRDtuBXVFtCzLo7kGAcGw+pA==" ]; then
            echo "::error::A integridade do Wrangler no lockfile não é a esperada."
            exit 1
          fi
          VERSAO=$(node "$FERR/node_modules/wrangler/bin/wrangler.js" --version | tail -1)
          [ "$VERSAO" = "4.161.0" ] || { echo "::error::Versão do Wrangler inesperada: $VERSAO"; exit 1; }

      # recebe só o pacote, o hash e o commit públicos do job verificar; confere o hash e escreve a configuração de publicação aqui mesmo
      - name: Reconstituir o pacote aprovado e preparar a publicação (sem secrets)
        env:
          PACOTE_B64: ${{ needs.verificar.outputs.pacote }}
          SHA256_ESPERADO: ${{ needs.verificar.outputs.sha256 }}
          COMMIT_APROVADO: ${{ needs.verificar.outputs.commit }}
          PIN_APROVADO: ${{ needs.verificar.outputs.pin }}
          MANIFESTO_APROVADO: ${{ needs.verificar.outputs.manifesto }}
        run: |
          DEST="$RUNNER_TEMP/publicar"
          mkdir -p "$DEST"
          printf '%s' "$PACOTE_B64" | base64 -d > "$DEST/index.js"
          if ! printf '%s  %s\n' "$SHA256_ESPERADO" "$DEST/index.js" | sha256sum -c - > /dev/null; then
            echo "::error::O hash do pacote recebido não confere com o do job verificar."
            exit 1
          fi
          cat > "$DEST/base.jsonc" <<'JSON'
          {
            "name": "rac-icloud-auth-poc",
            "compatibility_date": "2026-11-13",
            "workers_dev": true,
            "observability": { "enabled": false },
            "durable_objects": { "bindings": [{ "name": "CONSUMO", "class_name": "ConsumoUnico" }] },
            "migrations": [{ "tag": "v1", "new_sqlite_classes": ["ConsumoUnico"] }]
          }
          JSON
          jq --arg main "$DEST/index.js" '. + {main: $main, no_bundle: true}' "$DEST/base.jsonc" > "$DEST/wrangler.publicar.jsonc"
          echo "Pacote conferido: sha256 $SHA256_ESPERADO (commit da POC $COMMIT_APROVADO; pin aprovado $PIN_APROVADO, manifesto $MANIFESTO_APROVADO)"

      # só curl e jq; o token vai por substituição de processo, nunca como argumento visível na lista de processos
      - name: Conferir o token Cloudflare (sem mostrar dados da conta)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os secrets CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID no ambiente cloudflare-poc."
            exit 1
          fi
          verificar() {
            curl -sS -m 20 -K <(printf 'header = "Authorization: Bearer %s"\n' "$CLOUDFLARE_API_TOKEN") "$1" | jq -r 'select(.success == true) | .result.status' || true
          }
          STATUS=$(verificar "https://api.cloudflare.com/client/v4/user/tokens/verify")
          [ "$STATUS" = "active" ] || STATUS=$(verificar "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          if [ "$STATUS" != "active" ]; then
            echo "::error::A Cloudflare não confirmou o token como ativo."
            exit 1
          fi
          echo "Token Cloudflare ativo (e-mail e nome da conta não são exibidos)."

      # último passo do job: o Wrangler fixado pelo lockfile, num diretório vazio, com a configuração escrita neste arquivo e o pacote aprovado
      - name: Publicar o pacote aprovado (Workers Free)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd "$RUNNER_TEMP/publicar"
          node "$GITHUB_WORKSPACE/experimentos/icloud-auth-probe-ferramenta/node_modules/wrangler/bin/wrangler.js" deploy --config "$RUNNER_TEMP/publicar/wrangler.publicar.jsonc"

  executar:
    needs: provisionar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: icloud-auth-poc
    # a única permissão deste job: pedir o token OIDC. Sem contents, sem escrita e sem credencial Cloudflare. Os secrets do Environment (Apple) só são
    # citados no passo da P1, e só são injetados lá; nenhum outro passo os recebe.
    permissions:
      id-token: write
    env:
      # URL fixa e não sensível (nada vem do job anterior)
      WORKER_URL: https://rac-icloud-auth-poc.raynercarvalho.workers.dev
      AUDIENCIA_PREFIXO: rac-inbox-icloud-poc
    defaults:
      run:
        shell: bash
    steps:
      - name: Só na main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Este workflow só roda a partir da main (ref atual: $GITHUB_REF)."
            exit 1
          fi

      # pré-checagem SEM efeito e sem credencial (todas as operações): confirma que o Worker publicado já responde e aceita o JWT. Só aqui a repetição é
      # permitida (propagação do Worker novo: sem rede ou 404). O token OIDC só passa por variável de ambiente, pipe e substituição de processo
      # (/dev/fd): nunca por argumento de comando, arquivo ou artefato; o valor é mascarado no log.
      - name: Validar o JWT no Worker (ensaio sem efeito, sem credencial e sem acesso à Apple)
        run: |
          AUDIENCIA="$AUDIENCIA_PREFIXO:validar_oidc"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::O GitHub não forneceu o pedido de token OIDC (falta a permissão id-token neste job)."
            exit 1
          fi

          PEDIDO=$(curl -sS -m 20 -K <(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCIA}")
          JWT=$(jq -r '.value // empty' <<< "$PEDIDO")
          unset PEDIDO
          if [ -z "$JWT" ]; then
            echo "::error::O GitHub não devolveu o token OIDC."
            exit 1
          fi
          echo "::add-mask::$JWT"

          RESP="$RUNNER_TEMP/auth-probe.json"
          : > "$RESP"
          CODE=000
          for TENTATIVA in 1 2 3 4 5; do
            CODE=$(curl -sS -m 40 -o "$RESP" -w '%{http_code}' -X POST "$WORKER_URL/auth-probe" \
                  -K <(printf 'header = "Authorization: Bearer %s"\n' "$JWT") \
                  -H "Content-Type: application/json" --data '{"operacao":"validar_oidc"}' || true)
            CODE=${CODE:-000}
            [ "$CODE" = "200" ] && break
            # repete só enquanto o Worker novo ainda propaga (sem rede ou 404); qualquer resposta da política é evidência e encerra
            if [ "$CODE" = "000" ] || [ "$CODE" = "404" ]; then
              echo "Tentativa $TENTATIVA: HTTP $CODE; aguardando a propagação do Worker."
              sleep 6
            else
              break
            fi
          done
          unset JWT

          {
            echo "### Validação OIDC (ensaio sem efeito, sem credencial e sem acesso à Apple)"
            echo
            echo "- Executado em: $(date -u '+%d/%m/%Y %H:%M:%S') UTC"
            echo "- Resposta HTTP do Worker: $CODE"
            echo "- Resposta (só códigos e booleanos):"
            echo '```json'
            head -c 600 "$RESP" | jq . 2>/dev/null || echo '(resposta não é JSON)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CODE" = "200" ] && jq -e '.ok == true and .oidc == "validado" and .operacao_reconhecida == true' "$RESP" > /dev/null 2>&1; then
            echo "JWT OIDC aceito pelo Worker e operação reconhecida (sem credencial e sem acesso à Apple)."
            exit 0
          fi
          echo "::error::O Worker não aceitou a validação (HTTP $CODE); veja o motivo no resumo. Nenhuma ação fora do escopo."
          exit 1

      # prova SINTÉTICA do uso único no runtime publicado, sem credencial: dez chamadas simultâneas da MESMA execução (tokens diferentes) devem dar
      # exatamente um 200 e nove 409; depois o mesmo token e um token novo da mesma execução devem dar 409. Estas são as chamadas sob teste (não há
      # repetição por falha): cada código recebido é evidência e entra no resumo.
      - name: Prova sintética do uso único (concorrência e replay, sem credencial e sem acesso à Apple)
        if: ${{ inputs.operacao == 'validar_uso_unico' }}
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::O GitHub não forneceu o pedido de token OIDC (falta a permissão id-token neste job)."
            exit 1
          fi
          pedir_token() {
            local pedido
            pedido=$(curl -sS -m 20 -K <(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$AUDIENCIA_PREFIXO:validar_uso_unico")
            JWT=$(jq -r '.value // empty' <<< "$pedido")
            [ -n "$JWT" ] || return 1
            echo "::add-mask::$JWT"
          }
          # uma chamada: grava só o código HTTP em $1 e o corpo (resposta do Worker, sem dado sensível) em $1.corpo
          chamar() {
            local code
            code=$(curl -sS -m 40 -o "$1.corpo" -w '%{http_code}' -X POST "$WORKER_URL/auth-probe" \
                  -K <(printf 'header = "Authorization: Bearer %s"\n' "$2") \
                  -H "Content-Type: application/json" --data '{"operacao":"validar_uso_unico"}' || true)
            printf '%s' "${code:-000}" > "$1"
          }
          D="$RUNNER_TEMP/uso-unico"
          mkdir -p "$D"
          N=10
          TOKENS=()
          for I in $(seq 1 "$N"); do
            pedir_token || { echo "::error::O GitHub não devolveu o token OIDC."; exit 1; }
            TOKENS+=("$JWT")
          done
          for I in $(seq 0 $((N - 1))); do chamar "$D/c$I" "${TOKENS[$I]}" & done
          wait
          ACEITAS=0; REPETIDAS=0; OUTRAS=0
          for I in $(seq 0 $((N - 1))); do
            case "$(cat "$D/c$I")" in
              200) ACEITAS=$((ACEITAS + 1)) ;;
              409) REPETIDAS=$((REPETIDAS + 1)) ;;
              *) OUTRAS=$((OUTRAS + 1)) ;;
            esac
          done
          chamar "$D/r1" "${TOKENS[0]}"
          pedir_token || { echo "::error::O GitHub não devolveu o token OIDC."; exit 1; }
          chamar "$D/r2" "$JWT"
          unset JWT TOKENS
          R1=$(cat "$D/r1"); R2=$(cat "$D/r2")
          {
            echo "### Prova sintética do uso único (runtime publicado, sem credencial e sem acesso à Apple)"
            echo
            echo "- Executado em: $(date -u '+%d/%m/%Y %H:%M:%S') UTC"
            echo "- $N chamadas simultâneas da mesma execução: **$ACEITAS aceita(s) (HTTP 200)**, **$REPETIDAS recusada(s) (HTTP 409)**, $OUTRAS outra(s)"
            echo "- Replay do mesmo token depois do sucesso: HTTP $R1 (esperado 409)"
            echo "- Token novo da mesma execução (jti diferente): HTTP $R2 (esperado 409)"
            for ARQ in "$D"/c*.corpo "$D"/r*.corpo; do
              jq -c '{ok, erro, motivo, detalhe}' "$ARQ" 2>/dev/null | sort -u
            done | sort | uniq -c | sed 's/^ *//; s/^/- respostas (só códigos): /'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ACEITAS" = "1" ] && [ "$REPETIDAS" = "$((N - 1))" ] && [ "$OUTRAS" = "0" ] && [ "$R1" = "409" ] && [ "$R2" = "409" ]; then
            echo "Uso único comprovado no runtime publicado: 1 aceita, $((N - 1)) recusadas, replay recusado."
            exit 0
          fi
          echo "::error::A prova do uso único não deu o resultado esperado (aceitas=$ACEITAS, recusadas=$REPETIDAS, outras=$OUTRAS, replay=$R1/$R2). Veja o resumo."
          exit 1

      # P1: autenticação IMAP somente leitura. UMA única chamada, SEM repetição (um 000 ou 404 aqui encerra a prova). A credencial vem SÓ dos secrets do
      # Environment (cadastrados pelo dono direto no GitHub), entra no corpo por entrada padrão (nunca por argumento, arquivo, artefato ou output) e nada
      # a ecoa: o resumo mostra só os campos permitidos da resposta de esquema fechado do Worker.
      - name: P1 IMAP — autenticação somente leitura (uma única chamada, sem repetição)
        if: ${{ inputs.operacao == 'p1_imap' }}
        env:
          ICLOUD_USER: ${{ secrets.ICLOUD_USER }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
        run: |
          if [ -z "$ICLOUD_USER" ] || [ -z "$ICLOUD_APP_PASSWORD" ]; then
            echo "::error::Faltam os secrets ICLOUD_USER e/ou ICLOUD_APP_PASSWORD no Environment icloud-auth-poc. Cadastre-os direto no GitHub (nunca no chat) e rode de novo."
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::O GitHub não forneceu o pedido de token OIDC (falta a permissão id-token neste job)."
            exit 1
          fi
          PEDIDO=$(curl -sS -m 20 -K <(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$AUDIENCIA_PREFIXO:p1_imap")
          JWT=$(jq -r '.value // empty' <<< "$PEDIDO")
          unset PEDIDO
          if [ -z "$JWT" ]; then
            echo "::error::O GitHub não devolveu o token OIDC."
            exit 1
          fi
          echo "::add-mask::$JWT"
          RESP="$RUNNER_TEMP/p1-imap.json"
          : > "$RESP"
          CODE=$(jq -n '{operacao: "p1_imap", usuario: env.ICLOUD_USER, senha: env.ICLOUD_APP_PASSWORD}' | curl -sS -m 40 -o "$RESP" -w '%{http_code}' -X POST "$WORKER_URL/auth-probe" \
                -K <(printf 'header = "Authorization: Bearer %s"\n' "$JWT") \
                -H "Content-Type: application/json" --data-binary @- || true)
          CODE=${CODE:-000}
          unset JWT ICLOUD_USER ICLOUD_APP_PASSWORD
          {
            echo "### P1 · IMAP somente leitura (uma única chamada)"
            echo
            echo "- Executado em: $(date -u '+%d/%m/%Y %H:%M:%S') UTC"
            echo "- Resposta HTTP do Worker: $CODE"
            echo "- Resposta (só os campos permitidos do esquema fechado):"
            echo '```json'
            head -c 4000 "$RESP" | jq '{ok, operacao, estagio, autenticado, logout, erro, motivo, detalhe, capabilities, pastas, pasta_teste_existe}' 2>/dev/null || echo '(resposta não é JSON)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" = "200" ] && jq -e '.ok == true and .autenticado == true' "$RESP" > /dev/null 2>&1; then
            echo "P1 concluída: autenticação IMAP, capabilities e estrutura de pastas obtidas (sem ler mensagens e sem alterar a caixa)."
            exit 0
          fi
          echo "::error::A P1 não foi concluída (HTTP $CODE); veja o estágio e o código de erro no resumo. Nenhuma nova tentativa é feita."
          exit 1

      # P2: leitura controlada de UMA mensagem da pasta RAC-TESTE (EXAMINE, somente leitura). UMA única chamada, SEM repetição (um 000 ou 404 aqui encerra a
      # prova). Mesma credencial da P1 (só dos secrets do Environment, por entrada padrão). A única entrada do usuário é o UID (número), que entra só por
      # variável de ambiente, é conferido aqui e de novo no Worker. O resumo mostra só os campos permitidos da resposta de esquema fechado: contagens,
      # tamanhos, indicadores e códigos; nunca assunto, endereço, texto, nome de arquivo ou bytes de anexo.
      - name: P2 IMAP — leitura controlada de uma mensagem da pasta RAC-TESTE (uma única chamada, sem repetição)
        if: ${{ inputs.operacao == 'p2_imap' }}
        env:
          ICLOUD_USER: ${{ secrets.ICLOUD_USER }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          UID_MENSAGEM: ${{ inputs.uid_mensagem }}
        run: |
          if [ -z "$ICLOUD_USER" ] || [ -z "$ICLOUD_APP_PASSWORD" ]; then
            echo "::error::Faltam os secrets ICLOUD_USER e/ou ICLOUD_APP_PASSWORD no Environment icloud-auth-poc. Cadastre-os direto no GitHub (nunca no chat) e rode de novo."
            exit 1
          fi
          if [ -n "$UID_MENSAGEM" ] && ! [[ "$UID_MENSAGEM" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::uid_mensagem deve ser um número inteiro positivo de até 10 dígitos, ou ficar vazio (a última mensagem da pasta)."
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::O GitHub não forneceu o pedido de token OIDC (falta a permissão id-token neste job)."
            exit 1
          fi
          PEDIDO=$(curl -sS -m 20 -K <(printf 'header = "Authorization: Bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$AUDIENCIA_PREFIXO:p2_imap")
          JWT=$(jq -r '.value // empty' <<< "$PEDIDO")
          unset PEDIDO
          if [ -z "$JWT" ]; then
            echo "::error::O GitHub não devolveu o token OIDC."
            exit 1
          fi
          echo "::add-mask::$JWT"
          RESP="$RUNNER_TEMP/p2-imap.json"
          : > "$RESP"
          CODE=$(jq -n --arg uid "$UID_MENSAGEM" '{operacao: "p2_imap", usuario: env.ICLOUD_USER, senha: env.ICLOUD_APP_PASSWORD} + (if $uid == "" then {} else {uid: ($uid | tonumber)} end)' | curl -sS -m 40 -o "$RESP" -w '%{http_code}' -X POST "$WORKER_URL/auth-probe" \
                -K <(printf 'header = "Authorization: Bearer %s"\n' "$JWT") \
                -H "Content-Type: application/json" --data-binary @- || true)
          CODE=${CODE:-000}
          unset JWT ICLOUD_USER ICLOUD_APP_PASSWORD
          if [ -n "$UID_MENSAGEM" ]; then ESCOLHA="UID $UID_MENSAGEM"; else ESCOLHA="a última da pasta"; fi
          {
            echo "### P2 · leitura controlada de uma mensagem da pasta RAC-TESTE (uma única chamada)"
            echo
            echo "- Executado em: $(date -u '+%d/%m/%Y %H:%M:%S') UTC"
            echo "- Resposta HTTP do Worker: $CODE"
            echo "- Mensagem escolhida: $ESCOLHA"
            echo "- Resposta (só os campos permitidos do esquema fechado: contagens, tamanhos, indicadores e códigos; nenhum conteúdo da mensagem):"
            echo '```json'
            head -c 8000 "$RESP" | jq '{ok, operacao, estagio, autenticado, logout, erro, motivo, detalhe, pasta_teste_existe, somente_leitura_confirmado, mensagens_na_pasta, mensagem}' 2>/dev/null || echo '(resposta não é JSON)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" = "200" ] && jq -e '.ok == true and .operacao == "p2_imap" and .autenticado == true' "$RESP" > /dev/null 2>&1; then
            echo "P2 concluída: uma mensagem da pasta de teste lida em somente leitura (só indicadores no resumo; nada foi alterado e nada foi guardado)."
            exit 0
          fi
          echo "::error::A P2 não foi concluída (HTTP $CODE); veja o estágio e o código de erro no resumo. Nenhuma nova tentativa é feita."
          exit 1
