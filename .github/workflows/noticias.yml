# A cada 3 horas: atualiza noticias.json (Sorocaba, tela inicial), tecdados.json (dados e tecnologia, Conexões do dia) e rumores.json (MLB, Esportes).
# De hora em hora (e na mão, pela aba Actions): newsletter.json (Newsletter, fontes RSS oficiais), uma coleta por turno de Brasília.
name: Atualizar notícias

on:
  schedule:
    - cron: "15 */3 * * *"   # todas as coletas
    - cron: "40 * * * *"     # só a Newsletter: o GitHub atrasa e pula rodadas, então há várias chances em cada turno
  workflow_dispatch: {}    # permite rodar na mão pela aba Actions

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # o main de agora (não o da hora do agendamento): uma rodada que esperou na fila vê a coleta da anterior
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias
        if: github.event.schedule != '40 * * * *'
        run: python scripts/atualizar_noticias.py

      - name: Buscar notícias de dados e tecnologia (Conexões do dia)
        if: github.event.schedule != '40 * * * *'
        run: python scripts/atualizar_tecdados.py

      - name: Buscar rumores da MLB (Esportes)
        id: rumores
        if: github.event.schedule != '40 * * * *'
        continue-on-error: true    # se falhar, as notícias ainda são salvas; o último passo marca a falha
        run: python scripts/atualizar_rumores.py

      # pelo turno de Brasília, não pela hora da rodada: o coletor (--se-preciso) só coleta se o turno vigente (manhã 6h,
      # tarde 12h, noite 18h) ainda não tem coleta, então rodadas atrasadas recuperam o turno e as repetidas não fazem nada.
      # Na mão (workflow_dispatch), coleta sempre.
      - name: Coletar a Newsletter (fontes RSS oficiais)
        id: newsletter
        continue-on-error: true    # se falhar, as outras coletas ainda são salvas; o último passo marca a falha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/atualizar_newsletter.py
          else
            python scripts/atualizar_newsletter.py --se-preciso
          fi

      - name: Salvar se mudou
        run: |
          git add -N tecdados.json rumores.json newsletter.json 2>/dev/null || true
          if git diff --quiet -- noticias.json tecdados.json rumores.json newsletter.json; then
            echo "Nenhuma notícia nova."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json tecdados.json rumores.json newsletter.json
          git commit -m "Notícias atualizadas"
          git pull --rebase --autostash
          git push

      - name: Avisar se os rumores falharam
        if: steps.rumores.outcome == 'failure'
        run: |
          echo "O robô de rumores da MLB falhou (veja o passo acima)."
          exit 1

      - name: Avisar se a Newsletter falhou
        if: steps.newsletter.outcome == 'failure'
        run: |
          echo "A coleta da Newsletter falhou: mais da metade das fontes fora do ar ou nenhuma notícia (veja o passo acima)."
          exit 1
