# A cada 3 horas: atualiza noticias.json (Sorocaba, tela inicial), tecdados.json (dados e tecnologia, Conexões do dia) e rumores.json (MLB, Esportes).
# Às 6h, 12h e 18h de Brasília (e na mão, pela aba Actions): newsletter.json (Newsletter, fontes RSS oficiais).
name: Atualizar notícias

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch: {}    # permite rodar na mão pela aba Actions

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias
        run: python scripts/atualizar_noticias.py

      - name: Buscar notícias de dados e tecnologia (Conexões do dia)
        run: python scripts/atualizar_tecdados.py

      - name: Buscar rumores da MLB (Esportes)
        id: rumores
        continue-on-error: true    # se falhar, as notícias ainda são salvas; o último passo marca a falha
        run: python scripts/atualizar_rumores.py

      # o agendamento acima roda a cada 3 horas; a Newsletter só nas rodadas das 9h, 15h e 21h UTC (6h, 12h e 18h de
      # Brasília), contando os atrasos de até uma hora do GitHub. Na mão (workflow_dispatch), roda sempre.
      - name: Coletar a Newsletter (fontes RSS oficiais)
        id: newsletter
        continue-on-error: true    # se falhar, as outras coletas ainda são salvas; o último passo marca a falha
        run: |
          HORA=$(date -u +%H)
          case "${{ github.event_name }}:$HORA" in
            workflow_dispatch:*|*:09|*:10|*:15|*:16|*:21|*:22) python scripts/atualizar_newsletter.py ;;
            *) echo "Fora do horário da Newsletter ($HORA h UTC)." ;;
          esac

      - name: Salvar se mudou
        run: |
          git add -N tecdados.json rumores.json newsletter.json 2>/dev/null || true
          if git diff --quiet -- noticias.json tecdados.json rumores.json newsletter.json; then
            echo "Nenhuma notícia nova."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json tecdados.json rumores.json newsletter.json
          git commit -m "Notícias atualizadas"
          git pull --rebase --autostash
          git push

      - name: Avisar se os rumores falharam
        if: steps.rumores.outcome == 'failure'
        run: |
          echo "O robô de rumores da MLB falhou (veja o passo acima)."
          exit 1

      - name: Avisar se a Newsletter falhou
        if: steps.newsletter.outcome == 'failure'
        run: |
          echo "A coleta da Newsletter falhou: mais da metade das fontes fora do ar ou nenhuma notícia (veja o passo acima)."
          exit 1
