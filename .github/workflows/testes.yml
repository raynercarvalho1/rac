# A cada publicação: roda os testes do site (tests/*.test.mjs). O resultado aparece na página Sistema.
name: Testes

on:
  push:
    branches: [main]
    paths-ignore: ["noticias.json", "tecdados.json", "vagas.json", "rumores.json", "newsletter.json"]
  workflow_dispatch: {}
  schedule:
    - cron: "30 10 * * 1"   # toda segunda, para pegar mudanças no Supabase mesmo sem publicação

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # navegador de verdade para tests/navegador.test.mjs (o site em si não tem dependências; isto é só do teste)
      - name: Instalar o Playwright e o Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Rodar os testes
        run: node --test tests/*.test.mjs
